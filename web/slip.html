<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application slip</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700;800&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
<style>
/* One A5 page the citizen keeps: what was filed in her name, and when she agreed to it. */
:root { --ink: #1c2533; --ink-2: #4d5868; --rule: #c9d0c6; --stamp: #2d4b9a; --sindoor: #a8321f; --paper: #ffffff; }
* { box-sizing: border-box; }
body { margin: 0; background: #eef1ec; color: var(--ink); font: 16px/1.45 "Mukta", "Noto Sans Tamil", system-ui, sans-serif; }
.page { max-width: 560px; margin: 20px auto; background: var(--paper); padding: 26px 28px; border: 1.5px solid var(--rule); }
h1 { font-size: 24px; margin: 0; font-weight: 800; }
.en { color: var(--ink-2); font-size: 14px; }
table { width: 100%; border-collapse: collapse; margin: 16px 0; }
td { padding: 6px 2px; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.v { font-weight: 700; text-align: right; }
td.v small { display: block; font-weight: 400; color: var(--stamp); font-size: 13px; }
.consent { border: 2px solid var(--stamp); border-radius: 10px; padding: 10px 14px; }
.risk { color: var(--sindoor); font-weight: 700; margin-top: 10px; }
.sign { display: flex; justify-content: space-between; margin-top: 34px; font-size: 14px; color: var(--ink-2); }
.sign span { border-top: 1px solid var(--ink-2); padding-top: 4px; min-width: 40%; }
.fine { font-size: 12px; color: var(--ink-2); margin-top: 18px; }
.actions { max-width: 560px; margin: 0 auto 30px; display: flex; gap: 10px; padding: 0 4px; }
.actions a, .actions button { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--stamp);
  background: var(--stamp); color: #fff; text-decoration: none; cursor: pointer; }
.actions a { background: #fff; color: var(--stamp); }
@media print { body { background: #fff; } .page { border: 0; margin: 0; } .actions { display: none; } }
</style>
</head>
<body>
<div class="page" id="page">Loading…</div>
<div class="actions"><button onclick="print()">Print slip</button><a id="wa" target="_blank" rel="noopener" hidden>Send on WhatsApp</a></div>
<script>
const T = {
  hi: { heading: "आवेदन की पर्ची", consent: (t, w) => `यह सारी जानकारी आपको पढ़कर सुनाई गई। आपने ${t} पर “${w}” कहकर पुष्टि की।`,
        risk: "जमा करने से पहले जाँचें:", op: "ऑपरेटर के हस्ताक्षर", cit: "आवेदक के हस्ताक्षर / अँगूठा" },
  ta: { heading: "விண்ணப்பச் சீட்டு", consent: (t, w) => `இந்த விவரங்கள் அனைத்தும் உங்களுக்குப் படித்துக் காட்டப்பட்டன. ${t} அன்று “${w}” என்று சொல்லி உறுதிப்படுத்தினீர்கள்.`,
        risk: "சமர்ப்பிக்கும் முன் சரிபார்க்கவும்:", op: "ஆபரேட்டர் கையொப்பம்", cit: "விண்ணப்பதாரர் கையொப்பம் / கைரேகை" },
};
const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
(async () => {
  const sid = new URLSearchParams(location.search).get("session");
  const r = await fetch(`/api/sessions/${encodeURIComponent(sid || "")}/slip`, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ snapshot: new URLSearchParams(location.hash.slice(1)).get("s") }) });
  if (!r.ok) { document.getElementById("page").textContent = "No confirmed application to print yet."; return; }
  const s = await r.json(), t = T[s.lang] || T.hi;
  document.documentElement.lang = s.lang;
  const when = new Date(s.consent_at * 1000).toLocaleString(s.lang === "ta" ? "ta-IN" : "hi-IN");
  document.getElementById("page").innerHTML = `
    <h1>${esc(t.heading)}</h1><div class="en">${esc(s.title[s.lang] || s.title.hi)} · ${esc(s.title.en)}</div>
    <table>${s.rows.map((row) => `<tr><td>${esc(row.label[s.lang] || row.label.hi)}<div class="en">${esc(row.label.en)}</div></td>
      <td class="v">${esc(row.value)}${row.portal ? `<small>${esc(row.portal)}</small>` : ""}</td></tr>`).join("")}</table>
    <div class="consent">${esc(t.consent(when, s.consent_words))}</div>
    ${s.warnings.length ? `<div class="risk">${esc(t.risk)} ${s.warnings.map((w) => esc(w[s.lang] || w.hi || w.en)).join(", ")}</div>` : ""}
    <div class="sign"><span>${esc(t.op)}</span><span>${esc(t.cit)}</span></div>
    <p class="fine">Filled with Bol Ke Bharo, an independent assistant. Not a government receipt: keep the portal's acknowledgement number too.</p>`;
  if (s.mobile) {
    const text = `${t.heading}: ${s.title[s.lang] || s.title.hi}\n` +
      s.rows.map((row) => `${row.label[s.lang] || row.label.hi}: ${row.value}`).join("\n") + `\n${t.consent(when, s.consent_words)}`;
    const wa = document.getElementById("wa");
    wa.href = `https://wa.me/91${s.mobile}?text=${encodeURIComponent(text)}`;
    wa.hidden = false;
  }
})();
</script>
</body>
</html>
