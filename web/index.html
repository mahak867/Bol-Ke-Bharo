<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bol Ke Bharo</title>
<style>
:root {
  --bg: #f7f5f0; --panel: #ffffff; --ink: #1d1b16; --muted: #6b665c; --line: #e4dfd4;
  --accent: #1f6f5c; --accent-ink: #ffffff; --warn: #9a3412; --warn-bg: #fff1e6;
  --low: #fff7d6; --ok: #e7f4ee; --op: #34497a; --cit: #1f6f5c;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15140f; --panel: #1f1d17; --ink: #f1ede4; --muted: #a39d90; --line: #33302a;
    --accent: #5fbfa3; --accent-ink: #0d1f1a; --warn: #fdba74; --warn-bg: #3a2414;
    --low: #3a3418; --ok: #17322a; --op: #9fb3e6; --cit: #5fbfa3; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, "Noto Sans Devanagari", sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
h1 { font-size: 18px; margin: 0; }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; }
.timer small { color: var(--muted); font-weight: 400; }
main { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
.say { font-size: 20px; padding: 14px; border-radius: 10px; background: var(--ok); margin-bottom: 14px; }
.mics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button { font: inherit; border-radius: 10px; border: 1px solid var(--line); padding: 12px; cursor: pointer;
  background: var(--panel); color: var(--ink); }
.mic { font-size: 17px; font-weight: 600; padding: 18px 10px; color: #fff; border: 0; }
.mic.op { background: var(--op); } .mic.cit { background: var(--cit); }
@media (prefers-color-scheme: dark) { .mic { color: #111; } }
.mic.live { outline: 4px solid var(--warn); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .75; } }
.typed { display: flex; gap: 8px; margin-top: 12px; }
.typed select, .typed input { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); min-width: 0; }
.typed input { flex: 1; }
.hfrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; flex-wrap: wrap; }
.listening { color: var(--warn); font-weight: 600; animation: pulse 1s infinite; }
.chips { font-size: 13px; color: var(--muted); margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chips span { border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; }
.events { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.event { border-radius: 8px; padding: 6px 10px; font-size: 14px; font-weight: 600; animation: pop .4s ease-out; }
.event.bad { background: var(--warn-bg); color: var(--warn); }
.event.good { background: var(--ok); color: var(--accent); }
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
.interim { color: var(--muted); min-height: 1.5em; margin-top: 8px; font-style: italic; }
.log { margin-top: 12px; max-height: 260px; overflow: auto; font-size: 14px; }
.log div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.log .OPERATOR b { color: var(--op); } .log .CITIZEN b { color: var(--cit); } .log .ASSISTANT { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.label { color: var(--muted); width: 42%; }
td.val { font-weight: 600; cursor: pointer; overflow-wrap: anywhere; }
tr.low td.val { background: var(--low); }
tr.empty td.val { color: var(--muted); font-weight: 400; }
.conf { font-size: 12px; color: var(--muted); font-weight: 400; display: block; }
.warn { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.status { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.pill { font-size: 13px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); }
.pill.done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 600; }
button:disabled { opacity: .45; cursor: not-allowed; }
pre { background: var(--bg); padding: 10px; border-radius: 8px; overflow: auto; font-size: 13px; }
.note { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Bol Ke Bharo · <span id="formTitle">…</span></h1>
  <div class="timer"><span id="timer">0:00</span> <small id="engine"></small></div>
  <button id="newBtn">New application</button>
</header>
<main>
  <section>
    <h2>Conversation</h2>
    <div class="say" id="say">…</div>
    <div class="mics">
      <button class="mic op" id="micOp">🎙 Operator bol rahe hain</button>
      <button class="mic cit" id="micCit">🎙 Citizen bol rahi hain</button>
    </div>
    <div class="hfrow"><label><input type="checkbox" id="hf" checked> Hands-free: listens after every question</label>
      <span class="listening" id="listening" hidden></span></div>
    <div class="chips">बोलकर चलाएँ: <span>“दोबारा” = repeat</span><span>“रुको” = pause</span><span>“नहीं, …” = correct</span></div>
    <div class="interim" id="interim"></div>
    <form class="typed" id="typed">
      <select id="who"><option value="citizen">Citizen</option><option value="operator">Operator</option></select>
      <input id="text" placeholder="Or type what was said…" autocomplete="off">
      <button>Send</button>
    </form>
    <p class="note" id="micNote"></p>
    <div class="log" id="log"></div>
  </section>
  <section>
    <h2>Application</h2>
    <div class="status" id="status"></div>
    <div class="events" id="events"></div>
    <div id="warnings"></div>
    <table id="form"></table>
    <div class="actions">
      <button id="speakBtn">🔊 Repeat</button>
      <button class="primary" id="exportBtn" disabled>Export for portal</button>
    </div>
    <pre id="exportOut" hidden></pre>
    <p class="note">Independent assistant — not a government service. Audio is not stored. Aadhaar is masked to the last 4 digits. A person always does the captcha, OTP and final submit.</p>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let state = null, timerStart = 0, timerHandle = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}

let handsFree = true, noInput = 0, ttsTimer = null;
function speak(text, then) {
  stopListening();
  if (!("speechSynthesis" in window) || !text) { then && then(); return; }
  speechSynthesis.cancel(); clearTimeout(ttsTimer);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "hi-IN"; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find((v) => v.lang.startsWith("hi"));
  if (v) u.voice = v;
  let done = false;
  const finish = () => { if (done) return; done = true; clearTimeout(ttsTimer); setTimeout(() => then && then(), 250); };
  u.onend = finish;
  // Some Chrome builds drop onend for long utterances: fall back to a length-based timer.
  ttsTimer = setTimeout(finish, 1500 + text.length * 110);
  speechSynthesis.speak(u);
}
function afterSpeaking() {
  if (handsFree && state && state.phase !== "done") listen("citizen", true);
}

let events = [];
function addEvent(kind, text) {
  events.unshift({ kind, text, t: new Date().toLocaleTimeString() });
  events = events.slice(0, 4);
  $("events").innerHTML = events.map((e) => `<div class="event ${e.kind}">${esc(e.text)} <small>· ${e.t}</small></div>`).join("");
}
function diffEvents(prev, s) {
  const ids = (x) => new Set((x ? x.warnings : []).map((w) => w.id));
  const before = ids(prev), after = ids(s);
  const LABEL = { name_match: "Name mismatch detected · नाम मेल नहीं खाता", min_age: "Age below 60 · उम्र 60 से कम",
                  age_proof: "Age proof missing · उम्र का प्रमाण नहीं" };
  for (const id of after) if (!before.has(id)) addEvent("bad", "⚠ " + (LABEL[id] || id));
  for (const id of before) if (!after.has(id)) addEvent("good", "✓ Fixed by voice · ठीक हो गया: " + (LABEL[id] || id).split(" · ")[0]);
  if (prev && s.transcript.some((l) => l.includes("XXXX XXXX")) && !prev.transcript.some((l) => l.includes("XXXX XXXX")))
    addEvent("good", "🔒 Full Aadhaar masked · सिर्फ़ आख़िरी 4 अंक रखे");
  if (prev && prev.phase !== "readback" && s.phase === "readback") addEvent("good", "🔊 Read-back started · पढ़कर सुना रहे हैं");
  if (prev && prev.phase !== "done" && s.phase === "done") addEvent("good", "✓ Consent captured by voice · “हाँ” दर्ज");
}

function render(s) {
  diffEvents(state, s);
  const prevSay = state && state.say;
  state = s;
  $("say").textContent = s.say;
  if (s.say !== prevSay) { noInput = 0; speak(s.say, afterSpeaking); }
  $("status").innerHTML =
    `<span class="pill">${s.fields.filter((f) => f.value !== null).length}/${s.fields.length} filled</span>` +
    `<span class="pill ${s.phase === "done" ? "done" : ""}">${{ collect: "Collecting", readback: "Waiting for haan", done: "Citizen confirmed ✓" }[s.phase]}</span>`;
  $("warnings").innerHTML = s.warnings.map((w) => `<div class="warn">⚠ ${esc(w.message)}</div>`).join("");
  $("form").innerHTML = s.fields.map((f) => {
    const low = f.value !== null && f.confidence < 0.7;
    const conf = f.value !== null
      ? `<span class="conf">${f.source === "operator" ? "typed" : "heard"} · ${Math.round(f.confidence * 100)}%${f.corrected ? " · corrected" : ""}${f.evidence ? " · “" + esc(f.evidence) + "”" : ""}</span>` : "";
    return `<tr class="${f.value === null ? "empty" : low ? "low" : ""}">
      <td class="label">${esc(f.label.hi)}<br><small>${esc(f.label.en)}</small></td>
      <td class="val" data-key="${f.key}" title="Click to edit">${f.value === null ? "—" : esc(f.value)}${conf}</td></tr>`;
  }).join("");
  $("log").innerHTML = s.transcript.slice().reverse().map((line) => {
    const [who, ...rest] = line.split(": ");
    return `<div class="${who}"><b>${who === "ASSISTANT" ? "🔊" : who}</b> ${esc(rest.join(": "))}</div>`;
  }).join("");
  $("exportBtn").disabled = s.phase !== "done";
}

function esc(x) { return String(x).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function newSession() {
  const info = await api("/api/info");
  $("engine").textContent = info.extractor === "RuleExtractor" ? "· offline rules (no API key)" : "· Claude";
  const s = await api("/api/sessions", { method: "POST", body: JSON.stringify({ form_id: "pension_up" }) });
  $("formTitle").textContent = "वृद्धावस्था पेंशन";
  $("exportOut").hidden = true;
  state = null; events = []; $("events").innerHTML = ""; render(s);
  timerStart = Date.now(); clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    if (state && state.phase === "done") return;
    const t = Math.floor((Date.now() - timerStart) / 1000);
    $("timer").textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
  }, 500);
}

async function sendTurn(speaker, text) {
  if (!text.trim() || !state) return;
  $("interim").textContent = "…";
  try { render(await api(`/api/sessions/${state.session_id}/turn`, { method: "POST", body: JSON.stringify({ speaker, text }) })); }
  catch (e) { alert(e.message); }
  $("interim").textContent = "";
}

// ---- Speech recognition (browser, Hindi + Hinglish) ----
// Hands-free: after the app finishes speaking it listens for the citizen; the recogniser's own
// end-of-speech detection ends the turn. Tap "Operator" to give the operator the next turn.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, liveSpeaker = null;
if (!SR) $("micNote").textContent = "This browser has no speech recognition. Use Chrome, or type below.";
const REPEAT = /^(दोबारा|दुबारा|फिर से|फिरसे|क्या कहा|dobara|phir se|repeat)/i;
const PAUSE = /^(रुको|रुकिए|ruko|stop|बस)/i;

function stopListening() {
  if (rec) { const r = rec; rec = null; r.onend = null; try { r.abort(); } catch (e) {} }
  liveSpeaker = null;
  $("micOp").classList.remove("live"); $("micCit").classList.remove("live");
  $("listening").hidden = true;
}

function listen(speaker, auto) {
  if (!SR || !state) return;
  stopListening();
  rec = new SR(); liveSpeaker = speaker;
  rec.lang = "hi-IN"; rec.interimResults = true; rec.continuous = false;
  const btn = speaker === "operator" ? $("micOp") : $("micCit");
  btn.classList.add("live");
  $("listening").hidden = false;
  $("listening").textContent = speaker === "operator" ? "🎙 सुन रहे हैं: ऑपरेटर…" : "🎙 सुन रहे हैं: नागरिक…";
  let heard = false;
  const me = rec;
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) { heard = true; handleSpeech(speaker, r[0].transcript.trim()); }
      else interim += r[0].transcript;
    }
    $("interim").textContent = interim;
  };
  rec.onerror = (e) => {
    if (e.error === "not-allowed") { handsFree = false; $("hf").checked = false;
      $("micNote").textContent = "Microphone blocked. Allow it in the address bar, then tap a mic button."; }
  };
  rec.onend = () => {
    if (rec !== me) return;           // a newer recogniser took over
    stopListening();
    if (heard || !auto || !handsFree) return;
    // No input: retry quietly once, then re-ask once, then pause and wait for a tap.
    noInput += 1;
    if (noInput === 1) listen("citizen", true);
    else if (noInput === 2) speak("क्या आप मुझे सुन पा रहे हैं? " + state.say, afterSpeaking);
    else $("micNote").textContent = "रुका हुआ। Paused: tap Citizen to continue.";
  };
  try { rec.start(); } catch (e) {}
}

function handleSpeech(speaker, text) {
  if (!text) return;
  if (REPEAT.test(text)) { speak(state.say, afterSpeaking); return; }
  if (PAUSE.test(text)) { handsFree = false; $("hf").checked = false; stopListening();
    $("micNote").textContent = "Hands-free paused. Tap a mic button to continue."; return; }
  $("micNote").textContent = "";
  sendTurn(speaker, text);
}

$("micOp").onclick = () => { speechSynthesis.cancel(); liveSpeaker === "operator" ? stopListening() : listen("operator", false); };
$("micCit").onclick = () => { speechSynthesis.cancel(); noInput = 0; liveSpeaker === "citizen" ? stopListening() : listen("citizen", true); };
$("hf").onchange = (e) => { handsFree = e.target.checked; if (!handsFree) stopListening(); else afterSpeaking(); };

$("typed").onsubmit = (e) => { e.preventDefault(); sendTurn($("who").value, $("text").value); $("text").value = ""; };
$("newBtn").onclick = newSession;
$("speakBtn").onclick = () => state && speak(state.say, afterSpeaking);
$("form").onclick = async (e) => {
  const td = e.target.closest("td.val"); if (!td) return;
  const v = prompt("Correct value for " + td.dataset.key, ""); if (v === null) return;
  try { render(await api(`/api/sessions/${state.session_id}/edit`, { method: "POST", body: JSON.stringify({ key: td.dataset.key, value: v }) })); }
  catch (err) { alert(err.message); }
};
$("exportBtn").onclick = async () => {
  const data = await api(`/api/sessions/${state.session_id}/export`);
  $("exportOut").textContent = JSON.stringify(data, null, 2); $("exportOut").hidden = false;
};
speechSynthesis && speechSynthesis.getVoices();
newSession();
</script>
</body>
</html>
