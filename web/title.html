<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bol Ke Bharo</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;800&display=swap" rel="stylesheet">
<style>
/* Title and closing cards for a recording without voiceover. ?end shows the closing card. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c2533; color: #eef1ec;
  font: 400 24px/1.5 "Mukta", system-ui, sans-serif; }
main { max-width: 980px; padding: 40px; }
.brand { color: #f0b84a; font-weight: 500; }
h1 { font-size: 56px; line-height: 1.1; margin: 10px 0 26px; font-weight: 800; }
p { margin: 8px 0; color: #d6dce6; }
small { display: block; margin-top: 30px; color: #a9b3c1; font-size: 18px; }
</style>
</head>
<body>
<main id="card"></main>
<script>
const end = new URLSearchParams(location.search).has("end");
document.getElementById("card").innerHTML = end ? `
  <div class="brand">Bol Ke Bharo · बोल के भरो</div>
  <h1>Conversation in. Verified application out.</h1>
  <p>Hands-free in Hindi and Tamil · mismatches fixed by voice · spoken read-back and “हाँ” before anything is filed</p>
  <p>Portal filled for the operator to submit · a slip for the citizen · Aadhaar kept as last 4 digits</p>
  <small>github.com/mahak867/Bol-Ke-Bharo</small>` : `
  <div class="brand">Bol Ke Bharo · बोल के भरो</div>
  <h1>Speak it. It's filled.</h1>
  <p>Lakhs of citizens get pension forms filled at Common Service Centres.</p>
  <p>They speak Hindi or Tamil. The portal wants typed English. One spelling mismatch and the form is rejected weeks later.</p>
  <p>Here, the operator and the citizen just talk.</p>
  <small>${new URLSearchParams(location.search).has("sim")
    ? "Automated walkthrough of the real app: the citizen's answers are fed in by a script. Captions show what is said."
    : "Real voices, recorded live. Captions show what is said."}</small>`;
</script>
</body>
</html>
